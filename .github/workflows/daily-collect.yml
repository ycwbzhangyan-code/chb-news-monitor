name: CHB News Daily Collection

on:
  schedule:
    # 每天香港时间早上8:00（UTC 0:00）运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  collect-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # 允许 git push 回仓库
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Daily Collection
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          TO_ADDRS: ${{ secrets.TO_ADDRS }}
          BCC_ADDRS: ${{ secrets.BCC_ADDRS }}
        run: node deploy/cloud/daily_collect.js
        continue-on-error: true

      - name: Commit and Push Updated Data
        if: always()
        run: |
          git config --global user.name "CHB Monitor Bot"
          git config --global user.email "chb-monitor-bot@chonghing.uk"
          git add data/news_items.json data/reports.json data/fetch_logs.json data/source_status.json data/run_health.json 2>/dev/null || true
          if git diff --staged --quiet 2>/dev/null; then
            echo "No data changes to commit"
          else
            git commit -m "daily: $(date -u +%Y-%m-%d) news collection update"
            git push
            echo "Data pushed, Vercel will auto-redeploy"
          fi
